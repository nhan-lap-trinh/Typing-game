<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn GDQP-AN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap">
<style>
:root{
  --bg:#F2F3EC; --surface:#FFFFFF; --ink:#1D2218; --muted:#5F6753; --line:#D9DCCD;
  --accent:#4A5D2A; --accent-ink:#FFFFFF; --khaki:#E8E1C6;
  --ok:#2E7A4C; --ok-bg:#E3F2E8; --bad:#B03D2B; --bad-bg:#F8E4E0; --warn:#8A6A12; --warn-bg:#F6EDCF;
  --display:"Oswald","Arial Narrow",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141711; --surface:#1D2119; --ink:#E6E9DD; --muted:#A2AA93; --line:#343A2D;
    --accent:#A7BC72; --accent-ink:#141711; --khaki:#2C2D22;
    --ok:#7ACB95; --ok-bg:#1C3324; --bad:#F08C79; --bad-bg:#3A1E19; --warn:#E3C466; --warn-bg:#33301C;
  }
}
:root[data-theme="dark"]{
  --bg:#141711; --surface:#1D2119; --ink:#E6E9DD; --muted:#A2AA93; --line:#343A2D;
  --accent:#A7BC72; --accent-ink:#141711; --khaki:#2C2D22;
  --ok:#7ACB95; --ok-bg:#1C3324; --bad:#F08C79; --bad-bg:#3A1E19; --warn:#E3C466; --warn-bg:#33301C;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:680px;margin:0 auto}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.byline{font-family:var(--display);font-weight:600;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
h1{font-family:var(--display);font-weight:600;font-size:1.35rem;letter-spacing:.02em;margin:0;text-transform:uppercase}
.sub{color:var(--muted);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:6px;margin-top:10px;background:var(--khaki);padding:4px;border-radius:10px}
.tabs button{flex:1;border:0;background:transparent;color:var(--ink);font:600 .92rem var(--body);padding:9px 6px;border-radius:7px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs .cnt{font-family:var(--display);font-weight:500;margin-left:4px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-top:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search]{flex:1 1 220px;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 .85rem var(--body);padding:8px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.meta{color:var(--muted);font-size:.85rem;margin:10px 0 4px}
.list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.num{font-family:var(--display);font-weight:500;color:var(--muted);font-size:.85rem;letter-spacing:.05em}
.q{font-weight:600;margin:2px 0 8px;text-wrap:pretty}
.ans{display:flex;gap:8px;align-items:flex-start;background:var(--ok-bg);color:var(--ink);border-radius:7px;padding:8px 10px;cursor:pointer}
.ans b{font-family:var(--display);color:var(--ok);font-weight:600}
.hide .ans span{filter:blur(6px);user-select:none}
.hide .ans.shown span{filter:none}
.flag{display:inline-block;margin-top:8px;font-size:.8rem;background:var(--warn-bg);color:var(--warn);padding:4px 8px;border-radius:6px}
/* practice */
.bar{height:6px;background:var(--khaki);border-radius:999px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.stats{display:flex;gap:14px;font-variant-numeric:tabular-nums;font-size:.9rem;color:var(--muted);flex-wrap:wrap}
.stats strong{font-family:var(--display);font-weight:600;font-size:1.05rem}
.stats .g strong{color:var(--ok)} .stats .r strong{color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:12px}
.card .q{font-size:1.08rem;margin-bottom:14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;padding:11px 12px;border-radius:9px;cursor:pointer}
.opt b{font-family:var(--display);font-weight:600;min-width:1.1em}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)} .opt.ok b{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)} .opt.bad b{color:var(--bad)}
.verdict{margin-top:12px;font-weight:600}
.verdict.good{color:var(--ok)} .verdict.no{color:var(--bad)}
.next{margin-top:14px;width:100%;border:0;background:var(--accent);color:var(--accent-ink);font:600 1rem var(--body);padding:13px;border-radius:9px;cursor:pointer}
.ghost{border:1px solid var(--line);background:transparent;color:var(--ink);font:500 .88rem var(--body);padding:8px 12px;border-radius:8px;cursor:pointer}
#set{font-weight:600;border-color:var(--accent)}
select{font:inherit;font-size:.88rem;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.done{text-align:center}
.done .big{font-family:var(--display);font-size:3rem;font-weight:600;color:var(--accent);line-height:1.1}
.hint{color:var(--muted);font-size:.8rem;margin-top:10px}
footer.credit{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:.82rem;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
footer.credit b{font-family:var(--display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><div><div class="byline">Nhân Lập Trình</div><h1>Ôn GDQP-AN</h1></div>
      <div class="row"><select id="set" aria-label="Chọn học phần"><option value="hp1">Học phần 1</option><option value="hp2">Học phần 2</option><option value="luat">Luật Giáo dục</option></select><span class="sub" id="total"></span></div></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="t-learn" aria-selected="true">Học nhanh</button>
      <button role="tab" id="t-quiz" aria-selected="false">Luyện tập</button>
      <button role="tab" id="t-wrong" aria-selected="false">Câu sai<span class="cnt" id="wcnt"></span></button>
    </div>
  </header>
  <main>
    <section id="v-learn">
      <div class="row">
        <input type="search" id="search" placeholder="Tìm từ khóa, vd: biên giới, dân quân…">
      </div>
      <div class="row" style="margin-top:8px">
        <button class="chip" id="c-hide" aria-pressed="false">Che đáp án (tự kiểm tra)</button>
        <button class="chip" id="c-flag" aria-pressed="false">Chỉ câu cần kiểm tra</button>
      </div>
      <div class="meta" id="lmeta"></div>
      <div class="list" id="llist"></div>
    </section>

    <section id="v-quiz" hidden>
      <div class="row" style="justify-content:space-between">
        <div class="stats" id="stats"></div>
        <div class="row">
          <select id="order" aria-label="Thứ tự câu">
            <option value="shuffle">Xáo trộn câu</option>
            <option value="seq">Theo thứ tự</option>
          </select>
          <button class="ghost" id="restart">Làm lại</button>
        </div>
      </div>
      <div class="bar"><i id="prog"></i></div>
      <div id="qbox"></div>
    </section>

    <section id="v-wrong" hidden>
      <div class="row" style="justify-content:space-between">
        <div class="meta" id="wmeta" style="margin:0"></div>
        <div class="row">
          <button class="ghost" id="wclear">Xóa danh sách</button>
          <button class="chip" id="wpractice" aria-pressed="true">Luyện lại câu sai</button>
        </div>
      </div>
      <div class="list" id="wlist"></div>
    </section>
  </main>
  <footer class="credit"><span>Biên soạn và phát triển bởi <b>Nhân Lập Trình</b></span><span>Ôn thi GDQP-AN · HP1, HP2 &amp; Luật Giáo dục</span></footer>
</div>

for (const k in SETS) SETS[k].q = SETS[k].q.map(r=>({q:r[0],o:r[1],a:r[2],n:r[3]}));
const L = "ABCD";
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let cur = store.get("gdqp_set", "hp1"); if (!SETS[cur]) cur = "hp1";
let Q, wrong;
const saveWrong = () => { store.set("gdqp_wrong_" + cur, [...wrong]); $("wcnt").textContent = wrong.size ? " " + wrong.size : ""; };
function loadSet(k){
  cur = k; store.set("gdqp_set", k); $("set").value = k;
  Q = SETS[k].q; wrong = new Set(store.get("gdqp_wrong_" + k, []));
  $("total").textContent = Q.length + " câu";
  const hasFlag = Q.some(x => x.n); $("c-flag").hidden = !hasFlag;
  if (!hasFlag && onlyFlag){ onlyFlag = false; $("c-flag").setAttribute("aria-pressed", false); }
  $("search").value = ""; quiz = null; saveWrong();
}
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase();

/* tabs */
const views = {learn:"v-learn", quiz:"v-quiz", wrong:"v-wrong"};
function show(v){
  for (const k in views){ $(views[k]).hidden = k !== v; $("t-"+k).setAttribute("aria-selected", k===v); }
  store.set("gdqp_tab", v);
  if (v === "wrong") renderWrong();
  if (v === "quiz" && !quiz) startQuiz();
  window.scrollTo(0,0);
}
["learn","quiz","wrong"].forEach(k => $("t-"+k).onclick = () => show(k));

/* learn */
let hideAns = false, onlyFlag = false;
function itemHTML(x, i){
  return `<article class="item"><div class="num">CÂU ${i+1}</div>
    <div class="q">${esc(x.q)}</div>
    <div class="ans" data-i="${i}"><b>${L[x.a]}.</b><span>${esc(x.o[x.a])}</span></div>
    ${x.n ? `<div class="flag">Cần kiểm tra lại: ${esc(x.n)}</div>` : ""}</article>`;
}
function renderLearn(){
  const term = norm($("search").value.trim());
  const idx = Q.map((x,i)=>i).filter(i => (!onlyFlag || Q[i].n) &&
    (!term || norm(Q[i].q + " " + Q[i].o.join(" ")).includes(term)));
  $("lmeta").textContent = idx.length === Q.length ? `Hiển thị toàn bộ ${Q.length} câu` : `${idx.length} / ${Q.length} câu`;
  $("llist").className = "list" + (hideAns ? " hide" : "");
  $("llist").innerHTML = idx.length ? idx.map(i => itemHTML(Q[i], i)).join("") : `<div class="empty">Không có câu nào khớp “${esc($("search").value)}”.</div>`;
}
$("llist").addEventListener("click", e => { const a = e.target.closest(".ans"); if (a) a.classList.toggle("shown"); });
$("search").oninput = renderLearn;
$("c-hide").onclick = () => { hideAns = !hideAns; $("c-hide").setAttribute("aria-pressed", hideAns); renderLearn(); };
$("c-flag").onclick = () => { onlyFlag = !onlyFlag; $("c-flag").setAttribute("aria-pressed", onlyFlag); renderLearn(); };

/* quiz */
let quiz = null;
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function startQuiz(subset){
  const base = subset || Q.map((x,i)=>i);
  const order = $("order").value === "shuffle" ? shuffle(base) : base;
  quiz = { list: order, pos: 0, ok: 0, bad: 0, answered: false, subset: !!subset, perm: null };
  renderQ();
}
function renderStats(){
  const done = quiz.ok + quiz.bad;
  $("stats").innerHTML = `<span>Câu <strong>${Math.min(quiz.pos+1, quiz.list.length)}</strong>/${quiz.list.length}</span>
    <span class="g">Đúng <strong>${quiz.ok}</strong></span><span class="r">Sai <strong>${quiz.bad}</strong></span>
    ${quiz.subset ? "<span>· Đang ôn câu sai</span>" : ""}`;
  $("prog").style.width = (done / quiz.list.length * 100) + "%";
}
function renderQ(){
  renderStats();
  if (quiz.pos >= quiz.list.length){
    const pct = Math.round(quiz.ok / quiz.list.length * 100);
    $("qbox").innerHTML = `<div class="card done"><div class="big">${quiz.ok}/${quiz.list.length}</div>
      <p>Đúng ${pct}%. ${quiz.bad ? `Có ${quiz.bad} câu sai đã được lưu vào mục Câu sai.` : "Không sai câu nào."}</p>
      <button class="next" id="again">Làm lượt mới</button>
      ${wrong.size ? `<button class="ghost" id="gowrong" style="margin-top:8px;width:100%">Luyện lại ${wrong.size} câu sai</button>` : ""}</div>`;
    $("again").onclick = () => startQuiz();
    if ($("gowrong")) $("gowrong").onclick = () => startQuiz([...wrong]);
    return;
  }
  const qi = quiz.list[quiz.pos], x = Q[qi];
  quiz.perm = shuffle([0,1,2,3]); quiz.answered = false;
  $("qbox").innerHTML = `<div class="card"><div class="num">CÂU ${qi+1} TRONG ĐỀ</div>
    <div class="q">${esc(x.q)}</div>
    <div class="opts">${quiz.perm.map((oi,k)=>`<button class="opt" data-o="${oi}"><b>${L[k]}</b><span>${esc(x.o[oi])}</span></button>`).join("")}</div>
    <div id="fb"></div></div>
    <p class="hint">Mẹo: bấm phím 1–4 hoặc A–D để chọn, Enter để sang câu tiếp.</p>`;
  $("qbox").querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.o));
}
function answer(oi){
  if (quiz.answered) return;
  quiz.answered = true;
  const qi = quiz.list[quiz.pos], x = Q[qi], right = oi === x.a;
  $("qbox").querySelectorAll(".opt").forEach(b => {
    const o = +b.dataset.o; b.disabled = true;
    if (o === x.a) b.classList.add("ok"); else if (o === oi) b.classList.add("bad");
  });
  if (right){ quiz.ok++; if (quiz.subset) wrong.delete(qi); } else { quiz.bad++; wrong.add(qi); }
  saveWrong();
  const letter = L[quiz.perm.indexOf(x.a)];
  $("fb").innerHTML = `<div class="verdict ${right ? "good" : "no"}">${right ? "Chính xác!" : `Sai rồi, đáp án đúng là ${letter}.`}</div>
    ${x.n ? `<div class="flag">Cần kiểm tra lại: ${esc(x.n)}</div>` : ""}
    <button class="next" id="nextq">${quiz.pos+1 < quiz.list.length ? "Câu tiếp →" : "Xem kết quả"}</button>`;
  $("nextq").onclick = next; $("nextq").focus({preventScroll:true});
  renderStats();
}
function next(){ quiz.pos++; renderQ(); $("qbox").scrollIntoView({block:"nearest"}); }
document.addEventListener("keydown", e => {
  if ($("v-quiz").hidden || !quiz || e.target.tagName === "INPUT") return;
  const k = e.key.toUpperCase(); let n = "1234".indexOf(k); if (n < 0) n = L.indexOf(k);
  if (n >= 0 && !quiz.answered && quiz.perm){ answer(quiz.perm[n]); }
  else if (e.key === "Enter" && quiz.answered && document.activeElement?.id !== "nextq"){ next(); }
});
$("restart").onclick = () => startQuiz();
$("order").onchange = () => startQuiz();

/* wrong */
function renderWrong(){
  const idx = [...wrong].sort((a,b)=>a-b);
  $("wmeta").textContent = idx.length ? `${idx.length} câu bạn từng làm sai` : "";
  $("wpractice").hidden = $("wclear").hidden = !idx.length;
  $("wlist").innerHTML = idx.length ? idx.map(i => itemHTML(Q[i], i)).join("")
    : `<div class="empty">Chưa có câu sai nào. Làm bài ở mục Luyện tập, câu nào sai sẽ tự lưu vào đây.</div>`;
}
$("wpractice").onclick = () => { show("quiz"); startQuiz([...wrong]); };
$("wclear").onclick = () => { wrong.clear(); saveWrong(); renderWrong(); };

$("set").onchange = () => { loadSet($("set").value); renderLearn(); const tab = store.get("gdqp_tab","learn"); if (tab === "quiz") startQuiz(); if (tab === "wrong") renderWrong(); };
loadSet(cur); renderLearn();
const t = store.get("gdqp_tab", "learn"); if (t !== "learn") show(t);
</script>
